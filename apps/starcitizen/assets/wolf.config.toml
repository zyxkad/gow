[[apps]]
title = "StarCitizen"
icon_png_path = "https://raw.githubusercontent.com/zyxkad/gow/refs/heads/master/apps/starcitizen/assets/icon.png"

[apps.runner]
type = "docker"
name = "WolfStarCitizen"
image = "gow/starcitizen:latest"
mounts = []
env = [
    "RUN_SWAY=true",
    "GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia*",
]
devices = []
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "CapAdd": ["SYS_ADMIN", "SYS_NICE", "SYS_PTRACE", "NET_RAW", "MKNOD", "NET_ADMIN"],
    "SecurityOpt": ["seccomp=unconfined", "apparmor=unconfined"],
    "Ulimits": [{"Name":"nofile", "Hard":1024000, "Soft":1024000}],
    "Privileged": false,
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
\
"""